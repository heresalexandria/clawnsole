name: reference_video_tools
description: Clawnsole's minimal mobile bridge to pinned LGPL FFmpeg tools.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: ai.clawnsole.reference_video_tools
        pluginClass: ReferenceVideoToolsPlugin
      ios:
        pluginClass: ReferenceVideoToolsPlugin
