name: Release

# A release-labelled PR merge bumps both app versions and publishes the signed,
# notarized macOS desktop build. iOS distribution builds stay local-only.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: How to move the version
        type: choice
        options: [current, patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: bump version
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version || steps.current.outputs.version }}
      build: ${{ steps.bump.outputs.build || steps.current.outputs.build }}
      tag: ${{ steps.bump.outputs.tag || steps.current.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      skip: ${{ steps.kind.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Select release kind
        id: kind
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH: ${{ inputs.bump }}
        run: |
          if [ -n "$DISPATCH" ]; then
            kind="$DISPATCH"
          else
            kind="$(python3 scripts/release/select_bump.py)"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [ "$kind" = none ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump Flutter and Electron together
        id: bump
        if: steps.kind.outputs.skip != 'true' && steps.kind.outputs.kind != 'current'
        run: python3 scripts/release/bump_version.py "${{ steps.kind.outputs.kind }}"

      - name: Use current synchronized version
        id: current
        if: steps.kind.outputs.kind == 'current'
        run: python3 scripts/release/bump_version.py --current

      - name: Commit and push version
        id: push
        if: steps.kind.outputs.skip != 'true' && steps.kind.outputs.kind != 'current'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/package.json electron/package-lock.json flutter/pubspec.yaml
          git commit -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main

      - name: Select release commit
        id: release
        if: steps.kind.outputs.skip != 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  macos:
    name: build macOS desktop
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci --no-audit --no-fund

      - name: Build desktop artifacts
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # This workflow is triggered by a merged PR, but checks out the trusted
          # release commit from main. Electron Builder otherwise skips signing.
          CSC_FOR_PULL_REQUEST: true
        run: |
          for value in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!value}" ]; then echo "::error::$value is required for signed and notarized macOS releases"; exit 1; fi
          done
          export CLAWNSOLE_ELECTRON_SIGN=true
          CLAWNSOLE_ELECTRON_ARCH=arm64 ./electron/scripts/build_macos --config.mac.notarize=true

      - name: Verify signature and notarization
        env:
          EXPECTED_TEAM_ID: KMZ785G889
        run: |
          app=$(find electron/dist/release -path '*/Clawnsole.app' -type d | head -1)
          test -n "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
          signature=$(codesign -dvvv "$app" 2>&1)
          printf '%s\n' "$signature"
          grep -F 'Authority=Developer ID Application:' <<< "$signature"
          grep -F "TeamIdentifier=$EXPECTED_TEAM_ID" <<< "$signature"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - name: Collect desktop artifacts
        run: |
          mkdir -p outgoing
          find electron/dist/release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} outgoing/ \;
          test -n "$(ls -A outgoing)"
          ls -lh outgoing

      - name: Smoke test packaged desktop app
        run: |
          executable=$(find electron/dist/release -path '*/Clawnsole.app/Contents/MacOS/Clawnsole' | head -1)
          test -n "$executable"
          "$executable" --smoke

      - uses: actions/upload-artifact@v7
        with:
          name: build-macos-arm64
          path: outgoing/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: [prepare, macos]
    if: always() && needs.prepare.result == 'success' && needs.macos.result == 'success' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: incoming
          pattern: build-*

      - name: Gather and checksum
        run: |
          mkdir release
          find incoming -type f \( -name '*.dmg' -o -name '*.zip' \) \
            -exec mv {} release/ \;
          versioned_dmg="release/Clawnsole-${{ needs.prepare.outputs.version }}-mac-arm64.dmg"
          test -f "$versioned_dmg"
          cp "$versioned_dmg" release/Clawnsole-mac-arm64.dmg
          test -n "$(ls -A release)"
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ needs.prepare.outputs.sha }}" \
            --title "Clawnsole ${{ needs.prepare.outputs.version }}" \
            --generate-notes \
            --latest \
            release/*

      - name: Move rolling latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ needs.prepare.outputs.sha }}"
          git push -f origin latest
