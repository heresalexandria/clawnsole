name: Release

# A release-labelled PR merge bumps every app target to one version, then hands
# that exact main-branch commit to a trusted build run. The second run builds
# the desktop packages and iOS concurrently, uploads iOS directly to App Store
# Connect, then publishes only the desktop packages on GitHub.
#
# Merges may race. The push of the release version to main is the lock: a
# prepare run that loses it re-reads main and either releases the newer tip or
# stands down when a later release already contains its merge. Trusted build
# runs verify they still hold main's newest prepared version before building,
# and a newer release cancels a superseded release's in-flight builds, so the
# newest release always wins and bundle versions only move forward.
on:
  pull_request:
    types: [closed]
    branches: [main]
  repository_dispatch:
    types: [release-prepared]
  workflow_dispatch:
    inputs:
      bump:
        description: How to move the version
        type: choice
        options: [current, patch, minor, major]
        default: patch
      include_ios:
        description: Build and upload iOS to App Store Connect
        type: boolean
        default: true

permissions:
  contents: read

env:
  CLAWNSOLE_SITE_URL: https://clawnsole.app/

# Coordination is per build job rather than workflow-wide: prepare runs are
# short and made race-safe by the push lock, while each build job group lets
# a newer release cancel the superseded release's still-running builds.

jobs:
  prepare:
    name: bump version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version || steps.current.outputs.version }}
      build: ${{ steps.bump.outputs.build || steps.current.outputs.build }}
      tag: ${{ steps.bump.outputs.tag || steps.current.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      skip: >-
        ${{ steps.kind.outputs.skip == 'true' ||
            steps.bump.outputs.superseded == 'true' ||
            steps.verify.outputs.stale == 'true' }}
      mobile_test: ${{ steps.mobile_test.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || 'main' }}
          fetch-depth: 0

      - name: Verify prepared release commit is on main
        id: verify
        if: github.event_name == 'repository_dispatch'
        env:
          PREPARED_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [[ ! "$PREPARED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The prepared release SHA is invalid"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$PREPARED_SHA" ]; then
            echo "::error::The checked-out commit does not match the prepared release"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$actual_sha" FETCH_HEAD; then
            echo "::error::The prepared release commit is not on main"
            exit 1
          fi
          # A superseded release stands down green: the newer prepared release
          # covers this commit and ships with a higher bundle version.
          python3 scripts/release/verify_prepared.py FETCH_HEAD

      - name: Select release kind
        id: kind
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH: ${{ inputs.bump }}
          PREPARED: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          if [ "$PREPARED" = true ]; then
            kind=current
          elif [ -n "$DISPATCH" ]; then
            kind="$DISPATCH"
          else
            kind="$(python3 scripts/release/select_bump.py)"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [ "$kind" = none ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select mobile test mode
        id: mobile_test
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PREPARED: ${{ github.event_name == 'repository_dispatch' }}
          PREPARED_MOBILE_TEST: ${{ github.event.client_payload.mobile_test }}
        run: |
          if [ "$PREPARED" = true ]; then
            enabled="${PREPARED_MOBILE_TEST:-false}"
          elif jq -e '(. // []) | index("mobile-test") != null' \
            <<< "${LABELS:-null}" >/dev/null; then
            enabled=true
          else
            enabled=false
          fi
          case "$enabled" in
            true|false) ;;
            *) echo "::error::Invalid prepared mobile-test value"; exit 1 ;;
          esac
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Bump Flutter and Electron together
        id: bump
        if: steps.kind.outputs.skip != 'true' && steps.kind.outputs.kind != 'current'
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MOBILE_TEST: ${{ steps.mobile_test.outputs.enabled }}
        # A local iOS distribution build may prepare the exact next version in
        # the merged PR; prepare_release.py preserves it instead of bumping a
        # second time, advances the model catalog, and pushes the release
        # commit -- retrying against a moving main and standing down when a
        # newer release already contains this merge.
        run: |
          args=()
          if [ -n "$MERGE_SHA" ]; then
            args+=(--merge-ref "$MERGE_SHA")
          fi
          if [ "$MOBILE_TEST" = true ]; then
            args+=(--mobile-test)
          fi
          python3 scripts/release/prepare_release.py "${{ steps.kind.outputs.kind }}" "${args[@]}"

      - name: Use current synchronized version
        id: current
        if: steps.kind.outputs.kind == 'current'
        run: python3 scripts/release/bump_version.py --current

      - name: Select release commit
        id: release
        if: steps.kind.outputs.skip != 'true' && steps.bump.outputs.superseded != 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  dispatch:
    name: start trusted release builds
    needs: prepare
    if: github.event_name == 'pull_request' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dispatch prepared commit from main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          MOBILE_TEST: ${{ needs.prepare.outputs.mobile_test }}
        run: |
          jq -n \
            --arg sha "$RELEASE_SHA" \
            --argjson mobile_test "$MOBILE_TEST" \
            '{event_type: "release-prepared", client_payload: {sha: $sha, include_ios: true, mobile_test: $mobile_test}}' \
            > "$RUNNER_TEMP/release-dispatch.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input "$RUNNER_TEMP/release-dispatch.json"

  macos:
    name: build macOS desktop
    needs: prepare
    if: github.event_name != 'pull_request' && needs.prepare.outputs.skip != 'true'
    concurrency:
      group: release-macos
      cancel-in-progress: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install media-tool build prerequisites
        run: brew install autoconf automake libtool pkg-config

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci --no-audit --no-fund

      - name: Build desktop artifacts
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_ID }}
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET }}
        run: |
          for value in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!value}" ]; then echo "::error::$value is required for signed and notarized macOS releases"; exit 1; fi
          done
          export CLAWNSOLE_ELECTRON_SIGN=true
          CLAWNSOLE_ELECTRON_ARCH=arm64 ./electron/scripts/build_macos --config.mac.notarize=true

      - name: Verify signature and notarization
        env:
          EXPECTED_TEAM_ID: KMZ785G889
        run: |
          app=$(find electron/dist/release -path '*/Clawnsole.app' -type d | head -1)
          test -n "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
          signature=$(codesign -dvvv "$app" 2>&1)
          printf '%s\n' "$signature"
          grep -F 'Authority=Developer ID Application:' <<< "$signature"
          grep -F "TeamIdentifier=$EXPECTED_TEAM_ID" <<< "$signature"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - name: Collect desktop artifacts
        run: |
          mkdir -p outgoing
          find electron/dist/release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} outgoing/ \;
          test -n "$(ls -A outgoing)"
          ls -lh outgoing

      - name: Smoke test packaged desktop app
        run: |
          executable=$(find electron/dist/release -path '*/Clawnsole.app/Contents/MacOS/Clawnsole' | head -1)
          test -n "$executable"
          "$executable" --smoke

      - uses: actions/upload-artifact@v7
        with:
          name: build-macos-arm64
          path: outgoing/*
          retention-days: 7
          if-no-files-found: error

  windows:
    name: build Windows desktop
    needs: prepare
    if: github.event_name != 'pull_request' && needs.prepare.outputs.skip != 'true'
    concurrency:
      group: release-windows
      cancel-in-progress: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: false
          pub-cache: false

      - name: Build Windows x64 desktop app
        shell: bash
        env:
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_ID }}
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET }}
        run: ./flutter/scripts/build_windows

      - name: Smoke test Windows desktop app
        shell: pwsh
        run: |
          $executable = "flutter/build/windows/x64/runner/Release/Clawnsole.exe"
          if (-not (Test-Path $executable)) { throw "Windows executable was not built." }
          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Clawnsole exited during the Windows smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id

      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path outgoing | Out-Null
          $source = "flutter/build/windows/x64/runner/Release"
          $archive = "outgoing/Clawnsole-${{ needs.prepare.outputs.version }}-windows-x64.zip"
          # Extracting the ZIP yields one Clawnsole folder holding the app, the
          # bundled MSVC runtime, data, media tools, and install notes.
          $stage = Join-Path $env:RUNNER_TEMP "windows-package"
          $folder = Join-Path $stage "Clawnsole"
          if (Test-Path $stage) { Remove-Item -Path $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $folder | Out-Null
          Copy-Item -Path "$source/*" -Destination $folder -Recurse
          $readme = Get-Content -Raw "flutter/windows/package.README.txt"
          Set-Content -Path (Join-Path $folder "README.txt") -Value ($readme -replace "`r?`n", "`r`n") -NoNewline
          $required = @(
            "Clawnsole.exe", "flutter_windows.dll", "README.txt",
            "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll",
            "data/flutter_assets", "media-tools/ffmpeg.exe"
          )
          foreach ($item in $required) {
            if (-not (Test-Path (Join-Path $folder $item))) { throw "Windows package is missing $item." }
          }
          Compress-Archive -Path $folder -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive)) { throw "Windows archive was not created." }
          # Verify the layout users will see after extracting.
          $check = Join-Path $stage "check"
          Expand-Archive -Path $archive -DestinationPath $check
          $roots = @(Get-ChildItem -Path $check -Force | Select-Object -ExpandProperty Name)
          if ($roots.Count -ne 1 -or $roots[0] -ne "Clawnsole") { throw "Windows archive must contain only the Clawnsole folder." }
          $extracted = Join-Path $check "Clawnsole"
          foreach ($item in $required) {
            if (-not (Test-Path (Join-Path $extracted $item))) { throw "Windows archive is missing Clawnsole/$item." }
          }
          Remove-Item -Path $check -Recurse -Force
          Get-Item $archive | Format-List Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: build-windows-x64
          path: outgoing/*
          retention-days: 7
          if-no-files-found: error

  ios:
    name: build and upload iOS
    needs: prepare
    if: >-
      github.event_name != 'pull_request' &&
      needs.prepare.outputs.skip != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.include_ios == true) &&
      (github.event_name != 'repository_dispatch' || github.event.client_payload.include_ios == true)
    concurrency:
      group: release-ios
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 45
    environment: app-store-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Verify App Store build toolchain
        run: |
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk 'NR == 1 { split($2, version, "."); print version[1] }')"
          if [ "$xcode_major" -lt 26 ]; then
            echo "::error::App Store uploads must be built with Xcode 26 or newer"
            exit 1
          fi

      - name: Install App Store signing identity
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPECTED_TEAM_ID: KMZ785G889
        run: |
          for value in IOS_CERTIFICATE_P12 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE APPLE_TEAM_ID; do
            if [ -z "${!value}" ]; then echo "::error::$value is required for signed iOS releases"; exit 1; fi
          done
          if [ "$APPLE_TEAM_ID" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::APPLE_TEAM_ID does not match Clawnsole's Apple team"
            exit 1
          fi

          certificate="$RUNNER_TEMP/clawnsole-ios-distribution.p12"
          profile="$RUNNER_TEMP/clawnsole-app-store.mobileprovision"
          profile_plist="$RUNNER_TEMP/clawnsole-app-store-profile.plist"
          keychain="$RUNNER_TEMP/clawnsole-ios-signing.keychain-db"
          signing_config="$GITHUB_WORKSPACE/flutter/ios/Flutter/CISigning.xcconfig"
          export_options="$RUNNER_TEMP/ClawnsoleExportOptions.plist"
          keychain_password="$(openssl rand -hex 32)"

          {
            echo "CLAWNSOLE_IOS_CERTIFICATE_FILE=$certificate"
            echo "CLAWNSOLE_IOS_PROFILE_FILE=$profile"
            echo "CLAWNSOLE_IOS_PROFILE_PLIST=$profile_plist"
            echo "CLAWNSOLE_IOS_KEYCHAIN=$keychain"
            echo "CLAWNSOLE_IOS_SIGNING_CONFIG=$signing_config"
            echo "CLAWNSOLE_IOS_EXPORT_OPTIONS=$export_options"
          } >> "$GITHUB_ENV"

          printf '%s' "$IOS_CERTIFICATE_P12" | base64 -D > "$certificate"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -D > "$profile"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 2700 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

          identities="$(security find-identity -v -p codesigning "$keychain")"
          printf '%s\n' "$identities"
          grep -F 'Apple Distribution:' <<< "$identities"
          grep -F "($APPLE_TEAM_ID)" <<< "$identities"

          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          profile_app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist")"
          if [ "$profile_team" != "$APPLE_TEAM_ID" ] || \
             [ "$profile_app_identifier" != "$APPLE_TEAM_ID.app.clawnsole.clawnsole" ]; then
            echo "::error::IOS_PROVISIONING_PROFILE does not cover Clawnsole and the configured Apple team"
            exit 1
          fi
          if [ "$get_task_allow" != false ] || \
             /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1 || \
             /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$profile_plist" >/dev/null 2>&1; then
            echo "::error::IOS_PROVISIONING_PROFILE must be an App Store distribution profile"
            exit 1
          fi

          installed_profile="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          mkdir -p "$(dirname "$installed_profile")"
          cp "$profile" "$installed_profile"
          echo "CLAWNSOLE_IOS_INSTALLED_PROFILE=$installed_profile" >> "$GITHUB_ENV"

          cat > "$signing_config" <<XCCONFIG
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          DEVELOPMENT_TEAM = $APPLE_TEAM_ID
          PROVISIONING_PROFILE = $profile_uuid
          PROVISIONING_PROFILE_SPECIFIER = $profile_uuid
          XCCONFIG

          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>app.clawnsole.clawnsole</key><string>$profile_uuid</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$export_options"

      - name: Build production IPA
        env:
          CLAWNSOLE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_OAUTH_CLIENT_ID }}
          CLAWNSOLE_MOBILE_TEST_BUILD: ${{ needs.prepare.outputs.mobile_test }}
          ARTCRAFT_TEST_KEY: ${{ needs.prepare.outputs.mobile_test == 'true' && secrets.ARTCRAFT_TEST_KEY || '' }}
        run: |
          if [ -z "$CLAWNSOLE_GOOGLE_IOS_CLIENT_ID" ]; then
            echo "::error::GOOGLE_IOS_OAUTH_CLIENT_ID is required for production iOS builds"
            exit 1
          fi
          if [ "$CLAWNSOLE_MOBILE_TEST_BUILD" = true ] && [ -z "$ARTCRAFT_TEST_KEY" ]; then
            echo "::error::ARTCRAFT_TEST_KEY is required for a mobile-test release"
            exit 1
          fi
          ./scripts/build_ios.sh \
            --build-name "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build }}"
          ipa="$(find "$GITHUB_WORKSPACE/flutter/build/ios/ipa" -maxdepth 1 -name '*.ipa' -type f -print -quit)"
          if [ -z "$ipa" ]; then
            echo "::error::The production IPA was not created"
            exit 1
          fi
          echo "CLAWNSOLE_IOS_IPA=$ipa" >> "$GITHUB_ENV"

      - name: Verify IPA identity and version
        env:
          EXPECTED_TEAM_ID: KMZ785G889
        run: |
          verify_directory="$RUNNER_TEMP/clawnsole-ios-verification"
          echo "CLAWNSOLE_IOS_VERIFY_DIRECTORY=$verify_directory" >> "$GITHUB_ENV"
          mkdir -p "$verify_directory"
          ditto -x -k "$CLAWNSOLE_IOS_IPA" "$verify_directory"
          app="$(find "$verify_directory/Payload" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::The IPA does not contain an application bundle"
            exit 1
          fi

          info="$app/Info.plist"
          actual_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")"
          actual_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")"
          if [ "$actual_bundle_id" != app.clawnsole.clawnsole ] || \
             [ "$actual_version" != "${{ needs.prepare.outputs.version }}" ] || \
             [ "$actual_build" != "${{ needs.prepare.outputs.build }}" ]; then
            echo "::error::The IPA identity or version does not match the prepared release"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "$app"
          signature="$(codesign -dvvv "$app" 2>&1)"
          printf '%s\n' "$signature"
          grep -F 'Authority=Apple Distribution:' <<< "$signature"
          grep -F "TeamIdentifier=$EXPECTED_TEAM_ID" <<< "$signature"
          rm -rf "$verify_directory"

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          RELEASE_BUILD: ${{ needs.prepare.outputs.build }}
        run: |
          for value in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            if [ -z "${!value}" ]; then echo "::error::$value is required for App Store Connect uploads"; exit 1; fi
          done
          key_file="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "CLAWNSOLE_ASC_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$key_file"
          chmod 600 "$key_file"

          # altool returns after Apple accepts the upload. App Store processing,
          # TestFlight availability, and review status are deliberately not polled.
          #
          # Apple rejects a bundle version at or below its newest accepted
          # upload. Equal means this exact release build already reached App
          # Store Connect -- a re-run after a later failure, or a local
          # distribution build of the version this PR prepared -- so the
          # release continues without a second upload. Lower means this run
          # is stale and must not ship.
          if output="$(xcrun altool --upload-app \
            --type ios \
            -f "$CLAWNSOLE_IOS_IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --p8-file-path "$key_file" 2>&1)"; then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output"
            if grep -q 'ENTITY_ERROR\.ATTRIBUTE\.INVALID\.DUPLICATE' <<< "$output" && \
               grep -Eq "previousBundleVersion[[:space:]]*:[[:space:]]*${RELEASE_BUILD}([^0-9]|$)" <<< "$output"; then
              echo "::warning::Build $RELEASE_BUILD was already accepted by App Store Connect; continuing without a second upload"
            else
              exit "$status"
            fi
          fi

      - name: Remove temporary Apple credentials and IPA
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db || true
          if [ -n "${CLAWNSOLE_IOS_KEYCHAIN:-}" ]; then
            security delete-keychain "$CLAWNSOLE_IOS_KEYCHAIN" || true
          fi
          for path in \
            "${CLAWNSOLE_ASC_KEY_FILE:-}" \
            "${CLAWNSOLE_IOS_CERTIFICATE_FILE:-}" \
            "${CLAWNSOLE_IOS_PROFILE_FILE:-}" \
            "${CLAWNSOLE_IOS_PROFILE_PLIST:-}" \
            "${CLAWNSOLE_IOS_INSTALLED_PROFILE:-}" \
            "${CLAWNSOLE_IOS_SIGNING_CONFIG:-}" \
            "${CLAWNSOLE_IOS_EXPORT_OPTIONS:-}" \
            "${CLAWNSOLE_IOS_IPA:-}"; do
            if [ -n "$path" ]; then rm -f "$path"; fi
          done
          if [ -n "${CLAWNSOLE_IOS_VERIFY_DIRECTORY:-}" ]; then
            rm -rf "$CLAWNSOLE_IOS_VERIFY_DIRECTORY"
          fi

  publish:
    name: publish GitHub release
    needs: [prepare, macos, windows, ios]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.prepare.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.windows.result == 'success' &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
      needs.prepare.outputs.skip != 'true'
    # Publishes are quick and serialized rather than cancelled, so a nearly
    # finished release is never torn down half-published.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: incoming
          pattern: build-*

      - name: Gather and checksum
        run: |
          mkdir release
          find incoming -type f \( -name '*.dmg' -o -name '*.zip' \) \
            -exec mv {} release/ \;
          versioned_dmg="release/Clawnsole-${{ needs.prepare.outputs.version }}-mac-arm64.dmg"
          versioned_windows_zip="release/Clawnsole-${{ needs.prepare.outputs.version }}-windows-x64.zip"
          test -f "$versioned_dmg"
          test -f "$versioned_windows_zip"
          cp "$versioned_dmg" release/Clawnsole-mac-arm64.dmg
          cp "$versioned_windows_zip" release/Clawnsole-windows-x64.zip
          test -n "$(ls -A release)"
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ needs.prepare.outputs.sha }}" \
            --title "Clawnsole ${{ needs.prepare.outputs.version }}" \
            --generate-notes \
            --latest \
            release/*

      - name: Move rolling latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ needs.prepare.outputs.sha }}"
          git push -f origin latest
