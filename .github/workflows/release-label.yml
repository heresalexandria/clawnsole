name: Release label

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: release-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: release label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require one release decision
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/release/select_bump.py
