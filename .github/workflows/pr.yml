name: Pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-label:
    name: release label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require one release decision
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/release/select_bump.py

  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: flutter
        run: flutter pub get
      - working-directory: flutter
        run: dart format --output=none --set-exit-if-changed lib tool test
      - working-directory: flutter
        run: flutter analyze
      - working-directory: flutter
        run: flutter test

  electron:
    name: Electron checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - working-directory: electron
        run: npm ci --no-audit --no-fund
      - working-directory: electron
        run: npm test

  macos-package:
    name: macOS package check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Build unsigned ARM64 desktop package
        env:
          CLAWNSOLE_ELECTRON_ARCH: arm64
          CLAWNSOLE_ELECTRON_SIGN: 'false'
        run: ./flutter/scripts/build_macos
      - name: Smoke test packaged desktop app
        run: electron/dist/release/mac-arm64/Clawnsole.app/Contents/MacOS/Clawnsole --smoke
