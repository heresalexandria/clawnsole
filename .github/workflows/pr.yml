name: Pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  CLAWNSOLE_SITE_URL: https://clawnsole.app/

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: select jobs
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.paths.outputs.site }}
      flutter: ${{ steps.paths.outputs.flutter }}
      electron: ${{ steps.paths.outputs.electron }}
      macos: ${{ steps.paths.outputs.macos }}
      windows: ${{ steps.paths.outputs.windows }}
      linux: ${{ steps.paths.outputs.linux }}
      release_scripts: ${{ steps.paths.outputs.release_scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select affected jobs
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          site=false
          flutter=false
          electron=false
          macos=false
          windows=false
          linux=false
          release_scripts=false

          while IFS= read -r path; do
            case "$path" in
              flutter/*)
                flutter=true
                macos=true
                windows=true
                linux=true
                ;;
              electron/*)
                electron=true
                macos=true
                ;;
              native/apple/*)
                flutter=true
                electron=true
                macos=true
                ;;
              .github/workflows/pr.yml)
                site=true
                flutter=true
                electron=true
                macos=true
                windows=true
                linux=true
                release_scripts=true
                ;;
              scripts/release/*)
                release_scripts=true
                ;;
              .github/workflows/release.yml|claw.png|icon.png|scripts/prepare_platform_icons|scripts/render_platform_icon.swift)
                macos=true
                windows=true
                linux=true
                ;;
              docs/models/*)
                site=true
                flutter=true
                ;;
              docs/*|scripts/check_site_indexing.py)
                site=true
                ;;
              .github/pull_request_template.md|.github/workflows/labels.yml|.github/workflows/release-label.yml|.gitignore|AGENTS.md|LICENSE|PRIVACY.md|README.md)
                ;;
              *)
                # New product paths should receive full coverage until they are
                # classified explicitly above.
                flutter=true
                electron=true
                macos=true
                windows=true
                linux=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          {
            echo "site=$site"
            echo "flutter=$flutter"
            echo "electron=$electron"
            echo "macos=$macos"
            echo "windows=$windows"
            echo "linux=$linux"
            echo "release_scripts=$release_scripts"
          } >> "$GITHUB_OUTPUT"

  site:
    name: Site checks
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_site_indexing.py

  release-scripts:
    name: Release script checks
    needs: changes
    if: needs.changes.outputs.release_scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

  flutter:
    name: Flutter checks
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - working-directory: flutter
        run: flutter pub get
      - working-directory: flutter
        run: dart format --output=none --set-exit-if-changed lib tool test
      - working-directory: flutter
        run: flutter analyze
      - working-directory: flutter
        run: flutter test
      - name: Build internal Electron renderer
        working-directory: flutter
        run: >-
          flutter build web --release
          --dart-define=CLAWNSOLE_PROXY_URL=
          --dart-define=FLUTTER_WEB_ENABLE_INSTRUMENTATION=true
          --dart-define=CLAWNSOLE_SITE_URL=${{ env.CLAWNSOLE_SITE_URL }}

  electron:
    name: Electron checks
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - working-directory: electron
        run: npm ci --no-audit --no-fund
      - working-directory: electron
        run: npm test

  macos-package:
    name: macOS package check
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install media-tool build prerequisites
        run: brew install autoconf automake libtool pkg-config
      - name: Build unsigned ARM64 desktop package
        env:
          CLAWNSOLE_ELECTRON_ARCH: arm64
          CLAWNSOLE_ELECTRON_SIGN: 'false'
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_ID }}
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET }}
        run: ./flutter/scripts/build_macos
      - name: Smoke test packaged desktop app
        run: electron/dist/release/mac-arm64/Clawnsole.app/Contents/MacOS/Clawnsole --smoke
      - name: Verify native iCloud recovery and packaged helper protocol
        run: |
          xcrun swiftc -swift-version 5 \
            native/apple/ICloudReferenceHosting.swift \
            native/apple/ICloudReferenceHostingTests.swift \
            -o "$RUNNER_TEMP/clawnsole-icloud-host-tests"
          "$RUNNER_TEMP/clawnsole-icloud-host-tests"
          python3 native/apple/test_icloud_host_protocol.py \
            electron/dist/release/mac-arm64/Clawnsole.app/Contents/Resources/native-tools/clawnsole_icloud_host
      - name: Exercise renderer crash recovery in an isolated profile
        working-directory: electron
        run: ./node_modules/.bin/electron scripts/smoke-recovery.cjs
      - name: Exercise renderer diagnostics in an isolated profile
        working-directory: electron
        run: ./node_modules/.bin/electron scripts/smoke-diagnostics.cjs
      - name: Verify smoke failures exit unsuccessfully
        working-directory: electron
        shell: bash
        run: |
          if env -u CLAWNSOLE_COMPANION_TOKEN ./node_modules/.bin/electron . --smoke; then
            echo "Startup failure incorrectly passed the smoke test."
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi

  windows-package:
    name: Windows package check
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: false
          pub-cache: false
      - name: Build Windows x64 desktop app
        shell: bash
        env:
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_ID }}
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET }}
        run: ./flutter/scripts/build_windows
      - name: Smoke test Windows desktop app
        shell: pwsh
        run: |
          $executable = "flutter/build/windows/x64/runner/Release/Clawnsole.exe"
          if (-not (Test-Path $executable)) { throw "Windows executable was not built." }
          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Clawnsole exited during the Windows smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id

  linux-package:
    name: Linux ${{ matrix.arch }} package check
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable
          flutter-version: 3.47.0
          architecture: x64
          cache: true
      - name: Set up pinned Flutter SDK on ARM64
        if: matrix.arch == 'arm64'
        # Flutter publishes the ARM64 Dart/engine artifacts but no matching
        # Linux ARM64 SDK archive. Bootstrap the exact same release from source.
        run: |
          sdk="$RUNNER_TEMP/flutter-3.47.0"
          git clone --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git "$sdk"
          test "$(git -C "$sdk" rev-parse HEAD)" = 4cf24164269a5ebf0c16a028a00727d0e77bbb05
          echo "$sdk/bin" >> "$GITHUB_PATH"
          "$sdk/bin/flutter" config --enable-linux-desktop --no-analytics
          "$sdk/bin/flutter" precache --linux
      - name: Install Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libmpv-dev libepoxy-dev ffmpeg \
            dpkg-dev xvfb xauth dbus-x11 gnome-keyring xdg-user-dirs xdg-utils
      - name: Build Linux desktop packages
        env:
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_ID }}
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET }}
        run: ./flutter/scripts/build_linux
      - name: Exercise Linux media tools
        working-directory: flutter
        env:
          CLAWNSOLE_TEST_MEDIA_TOOLS_DIR: /usr/bin
        run: >-
          flutter test test/ffmpeg_video_frame_loader_test.dart
          test/reference_video_normalizer_test.dart
      - name: Install and smoke-test the Debian package
        run: |
          sudo apt-get install -y ./flutter/build/linux/packages/*.deb
          ./flutter/scripts/smoke_linux /opt/clawnsole
      - name: Extract and smoke-test the archive
        run: |
          mkdir -p "$RUNNER_TEMP/linux-archive"
          tar -xzf flutter/build/linux/packages/*.tar.gz -C "$RUNNER_TEMP/linux-archive"
          ./flutter/scripts/smoke_linux "$RUNNER_TEMP/linux-archive/Clawnsole"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-packages
          path: flutter/build/linux/packages/*
          retention-days: 7
          if-no-files-found: error
