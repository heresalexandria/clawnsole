name: Pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: select jobs
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.paths.outputs.flutter }}
      electron: ${{ steps.paths.outputs.electron }}
      macos: ${{ steps.paths.outputs.macos }}
      windows: ${{ steps.paths.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select affected jobs
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          flutter=false
          electron=false
          macos=false
          windows=false

          while IFS= read -r path; do
            case "$path" in
              flutter/*)
                flutter=true
                macos=true
                windows=true
                ;;
              electron/*)
                electron=true
                macos=true
                ;;
              .github/workflows/pr.yml|.github/workflows/web-preview.yml)
                flutter=true
                electron=true
                macos=true
                windows=true
                ;;
              .github/workflows/release.yml|claw.png|icon.png|scripts/prepare_platform_icons|scripts/render_platform_icon.swift)
                macos=true
                windows=true
                ;;
              .github/pull_request_template.md|.github/workflows/labels.yml|.github/workflows/release-label.yml|.gitignore|AGENTS.md|LICENSE|PRIVACY.md|README.md|docs/*|scripts/release/*)
                ;;
              *)
                # New product paths should receive full coverage until they are
                # classified explicitly above.
                flutter=true
                electron=true
                macos=true
                windows=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          {
            echo "flutter=$flutter"
            echo "electron=$electron"
            echo "macos=$macos"
            echo "windows=$windows"
          } >> "$GITHUB_OUTPUT"

  flutter:
    name: Flutter checks
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: flutter
        run: flutter pub get
      - working-directory: flutter
        run: dart format --output=none --set-exit-if-changed lib tool test
      - working-directory: flutter
        run: flutter analyze
      - working-directory: flutter
        run: flutter test
      - name: Build standalone web app
        env:
          CLAWNSOLE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          CLAWNSOLE_WEB_BASE_HREF: /clawnsole/app/
        run: ./flutter/scripts/build_github_pages
      - uses: actions/upload-artifact@v7
        with:
          name: clawnsole-github-pages-app
          path: flutter/build/github-pages/app
          if-no-files-found: error
          retention-days: 14

  electron:
    name: Electron checks
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - working-directory: electron
        run: npm ci --no-audit --no-fund
      - working-directory: electron
        run: npm test

  macos-package:
    name: macOS package check
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Build unsigned ARM64 desktop package
        env:
          CLAWNSOLE_ELECTRON_ARCH: arm64
          CLAWNSOLE_ELECTRON_SIGN: 'false'
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_ID }}
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET }}
        run: ./flutter/scripts/build_macos
      - name: Smoke test packaged desktop app
        run: electron/dist/release/mac-arm64/Clawnsole.app/Contents/MacOS/Clawnsole --smoke

  windows-package:
    name: Windows package check
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
          pub-cache: false
      - name: Build Windows x64 desktop app
        shell: bash
        env:
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_ID }}
          CLAWNSOLE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET }}
        run: ./flutter/scripts/build_windows
      - name: Smoke test Windows desktop app
        shell: pwsh
        run: |
          $executable = "flutter/build/windows/x64/runner/Release/Clawnsole.exe"
          if (-not (Test-Path $executable)) { throw "Windows executable was not built." }
          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Clawnsole exited during the Windows smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id
