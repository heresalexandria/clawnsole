name: Standalone web preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build GitHub Pages app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Build standalone app
        env:
          CLAWNSOLE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          CLAWNSOLE_WEB_BASE_HREF: /clawnsole/app/
        run: ./flutter/scripts/build_github_pages
      - uses: actions/upload-artifact@v7
        with:
          name: clawnsole-github-pages-app
          path: flutter/build/github-pages/app
          if-no-files-found: error
          retention-days: 14
